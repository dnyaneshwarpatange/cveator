[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cve-monitor-api"
version = "0.1.0"
description = "Vendor-neutral CVE monitoring API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.40,<2",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ijson>=3.3,<4",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.23,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/providers"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
